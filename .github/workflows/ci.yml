name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifica:
    runs-on: ubuntu-latest
    # Il client Supabase fallisce l'import senza queste due (vedi
    # src/lib/supabase.ts). In CI non si parla col server: sono segnaposto, non
    # credenziali. Valgono per tutto il job e non solo per la build: anche i test
    # importano il client, e senza fallivano all'avvio una ventina di file —
    # in locale non si vedeva, perché le prende dal file .env.
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `npm run build` esegue già `tsc` prima di Vite: il type-check di
      # produzione non è un passo a parte.
      - name: Build
        run: npm run build
