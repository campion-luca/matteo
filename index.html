<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F1F1EF" />
    <meta name="description" content="Matteo — allenamenti in palestra: schede, alzate e massimali, carichi consigliati e un allenatore che ti segue. Funziona offline e si installa." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Matteo" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Matteo</title>
    <!-- Il tema scuro, prima del primo frame: aspettando React la pagina
         lampeggerebbe chiara. Stesso conto di src/lib/tema.ts. -->
    <script>
      try {
        var tema = localStorage.getItem('jarvis-tema')
        if (tema === 'scuro' || (tema === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.tema = 'scuro'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B0B0B')
        }
      } catch (e) { /* storage negato: resta il chiaro */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
